name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Temporary write permission is used only by the PR #118 finalization job.
# The final bot-authored candidate restores the canonical read-only workflow.
permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The standard arm64 macOS pool has been persistently queued for this
          # repository while Linux/Windows jobs complete. The pinned Skia
          # artifact is universal, so use the standard Intel macOS 15 runner to
          # retain macOS/CoreText/AppKit coverage without depending on scarce
          # arm64 runner capacity.
          - name: macOS
            os: macos-15-intel
          - name: Windows
            os: windows-latest
          - name: Linux X11
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: T047 public attachment contract
        run: >-
          cmake
          -DSOURCE_DIR=${{ github.workspace }}
          -P tests/t047_attach_contract_tests.cmake

      - name: T048 external consumer source contract
        run: >-
          cmake
          -DSOURCE_DIR=${{ github.workspace }}
          -P tests/t048_external_consumer_contract_tests.cmake

      - name: T056 package source contract
        run: >-
          cmake
          -DSOURCE_DIR=${{ github.workspace }}
          -P tests/t056_package_source_contract_tests.cmake

      - name: T056 binary-data contract
        run: >-
          cmake
          -DSOURCE_DIR=${{ github.workspace }}
          -P tests/t056_binary_data_contract_tests.cmake

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libgl1-mesa-dev libfontconfig1-dev mesa-utils xvfb xauth

      - name: Configure Unix
        if: runner.os != 'Windows'
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DNATIVEUI_BUILD_PLATFORM=ON
          -DNATIVEUI_BUILD_EXAMPLES=ON
          -DNATIVEUI_BUILD_TESTS=ON
          -DNATIVEUI_SKIA_WINDOWS_CRT=MD

      # skia-builder's Windows archive is built with the MSVC ABI. Do not use
      # Ninja from Git Bash here: on hosted runners that can select MinGW and
      # cannot link the supplied Skia.lib. The native default Visual Studio
      # generator discovers the installed MSVC toolchain without relying on
      # shell PATH ordering.
      - name: Configure Windows MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DNATIVEUI_BUILD_PLATFORM=ON
          -DNATIVEUI_BUILD_EXAMPLES=ON
          -DNATIVEUI_BUILD_TESTS=ON
          -DNATIVEUI_SKIA_WINDOWS_CRT=MD

      - name: Build
        run: cmake --build build --config Release --parallel 2

      # Keep a real Linux/X11 renderer exposure in the normal merge gate. T042
      # stress caught a production crash here that the previous compile/core
      # coverage could not see. The native smoke uses one supported PROGRAM
      # world and the existing embedded multi-instance lifecycle path.
      - name: Linux X11 renderer and lifecycle smoke
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: >-
          xvfb-run -a
          -s "-screen 0 1280x1024x24 +extension GLX +render -noreset"
          sh -c 'glxinfo -B && ./build/nativeui_smoke_standalone'

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      - name: T047 external package contract
        run: >-
          cmake
          -DSOURCE_DIR=${{ github.workspace }}
          -DBUILD_DIR=${{ github.workspace }}/build
          -DBUILD_PACKAGE_DIR=${{ github.workspace }}/build/nativeui-package
          -DINSTALL_CMAKE_DIR=lib/cmake/NativeUI
          -DCONFIG=Release
          -P tests/t047_package_tests.cmake

      - name: T048 relocated external consumers
        run: >-
          cmake
          -DSOURCE_DIR=${{ github.workspace }}
          -DBUILD_DIR=${{ github.workspace }}/build
          -DINSTALL_CMAKE_DIR=lib/cmake/NativeUI
          -DCONFIG=Release
          -P tests/t048_external_consumer_tests.cmake

      - name: T056 build-tree and relocated binary-data consumers
        run: >-
          cmake
          -DSOURCE_DIR=${{ github.workspace }}
          -DBUILD_DIR=${{ github.workspace }}/build
          -DBUILD_PACKAGE_DIR=${{ github.workspace }}/build/nativeui-package
          -DINSTALL_CMAKE_DIR=lib/cmake/NativeUI
          -DCONFIG=Release
          -P tests/t056_package_tests.cmake

      # T053/CODE_REVIEW.md requires proof that two final consumers configured
      # together derive different Objective-C runtime namespaces while sharing
      # one generic Core/platform-C layer, and that both bridge images load in
      # one process without duplicate runtime classes.
      - name: macOS two-consumer Objective-C runtime isolation
        if: runner.os == 'macOS'
        run: >-
          cmake
          -DSOURCE_DIR=${{ github.workspace }}
          -DOUTER_BUILD=${{ github.workspace }}/build
          -P tests/check_objc_two_consumers.cmake

      # The real AppKit/Pugl path validates both the T028 clipboard regression
      # and CODE_REVIEW.md's lifecycle requirement: simultaneous PUGL_MODULE
      # editor instances, sibling destruction, survivor use and repeated cycles.
      - name: macOS clipboard and multi-instance lifecycle smoke
        if: runner.os == 'macOS'
        run: ./build/nativeui_smoke_standalone

  sanitizers:
    name: Linux ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: T047 public attachment contract
        run: >-
          cmake
          -DSOURCE_DIR=${{ github.workspace }}
          -P tests/t047_attach_contract_tests.cmake

      - name: T048 external consumer source contract
        run: >-
          cmake
          -DSOURCE_DIR=${{ github.workspace }}
          -P tests/t048_external_consumer_contract_tests.cmake

      - name: T056 package source contract
        run: >-
          cmake
          -DSOURCE_DIR=${{ github.workspace }}
          -P tests/t056_package_source_contract_tests.cmake

      - name: T056 binary-data contract
        run: >-
          cmake
          -DSOURCE_DIR=${{ github.workspace }}
          -P tests/t056_binary_data_contract_tests.cmake

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libfontconfig1-dev

      - name: Configure
        run: >-
          cmake -S . -B build-sanitize -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DNATIVEUI_BUILD_PLATFORM=OFF
          -DNATIVEUI_BUILD_EXAMPLES=OFF
          -DNATIVEUI_BUILD_TESTS=ON
          -DNATIVEUI_ENABLE_SANITIZERS=ON
          -DNATIVEUI_SKIA_CONFIG=Release

      - name: Build
        run: cmake --build build-sanitize --parallel 2

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          # Skia's Linux fallback path calls Fontconfig FcFontRenderPrepare,
          # whose process-lifetime caches are reported as leaks by LSan on the
          # hosted image. Keep leak detection enabled and suppress only this
          # known third-party allocation path; NativeUI/Skia leaks remain fatal.
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp:print_suppressions=1
        run: ctest --test-dir build-sanitize --output-on-failure

  finalize-t060:
    name: Finalize T060 durable design
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 118 && github.actor != 'github-actions[bot]' }}
    needs: [build, sanitizers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/t060-application-multi-window
          fetch-depth: 0

      - name: Update DESIGN and create clean bot-authored branch
        shell: bash
        run: |
          set -euo pipefail
          branch='feature/t060-application-multi-window'
          expected_main='ce86c86e663ad5f8464224874039312143146300'
          expected_pugl='195f79b22644010c81a5e0c3231c591856787ec6'

          git fetch origin main "$branch"
          test "$(git rev-parse origin/main)" = "$expected_main" || {
            echo 'main advanced; refusing unsafe finalization' >&2
            exit 1
          }
          test "$(git rev-parse origin/$branch)" = '${{ github.event.pull_request.head.sha }}' || {
            echo 'branch advanced; refusing stale finalization' >&2
            exit 1
          }
          grep -q "$expected_pugl" cmake/Dependencies.cmake || {
            echo 'reviewed Pugl pin is not present' >&2
            exit 1
          }
          git reset --hard "origin/$branch"

          python3 - <<'PY'
          from pathlib import Path
          import re

          old_pin = 'd12d63815b8cfe3f36293d3791a418e8f558ff1b'
          new_pin = '195f79b22644010c81a5e0c3231c591856787ec6'

          for path in (Path('CONTEXT.md'), Path('ROADMAP.md')):
              text = path.read_text().replace(old_pin, new_pin)
              path.write_text(text)

          design = Path('DESIGN.md')
          text = design.read_text()
          text = text.replace('**Updated:** September 7, 2026', '**Updated:** September 9, 2026', 1)
          text = text.replace(old_pin, new_pin)

          old_snapshot = ('- `StandaloneWindow` and `EmbeddedView` Pugl/OpenGL integration;\n'
                          '- clipboard bridging and platform smoke-test infrastructure;\n'
                          '- dedicated feature examples with `--self-test` coverage.\n\n'
                          'SVG/icon resources are being implemented separately in T023/PR #60 and are not part of the merged baseline described above until that PR lands.\n\n'
                          'A known macOS defect remains open in issue #64: multiple simultaneous `StandaloneWindow` instances currently expose a Pugl `PUGL_PROGRAM` application-world lifecycle problem. Multiple independent `EmbeddedView` instances are a separate path and are currently validated successfully.\n')
          new_snapshot = ('- explicit `Application` ownership for one standalone `PUGL_PROGRAM` world with multiple top-level `StandaloneWindow` views;\n'
                          '- independent `EmbeddedView` Pugl/OpenGL integration using `PUGL_MODULE`;\n'
                          '- clipboard bridging and platform smoke-test infrastructure;\n'
                          '- dedicated feature examples with `--self-test` coverage.\n\n'
                          'Standalone multi-window ownership follows #64 Decision B: one explicit `Application` owns the PROGRAM world/event pump and outlives every attached standalone window. Per-window retained UI, focus, capture, text and rendering state remains isolated. The legacy independent-world `StandaloneWindow(UI&, ...)` constructor is pre-v1 compatibility only and is scheduled for removal by T069; it is not a second supported multi-window model.\n')
          if old_snapshot in text:
              text = text.replace(old_snapshot, new_snapshot, 1)
          elif 'A known macOS defect remains open in issue #64' in text:
              raise SystemExit('unexpected DESIGN current-snapshot shape')

          replacement = '''### 5.2 Pugl world modes and standalone ownership

Standalone applications use one explicit application owner:

```cpp
ui::Application app;
ui::StandaloneWindow main{app, main_ui, {.title = "Main"}};
ui::StandaloneWindow settings{app, settings_ui, {.title = "Settings"}};
return app.run();
```

`Application` owns exactly one:

```cpp
puglNewWorld(PUGL_PROGRAM, 0);
```

Every v1 top-level `StandaloneWindow(Application&, ...)` borrows that world and owns only its own native view/render/UI/focus/capture/text state. `Application` is non-copyable/non-movable and must outlive all registered windows. Registration is Application-local and lifetime-safe; NativeUI has no mutable process-global, singleton or `thread_local` current Application/window registry.

`Application::run()` is the normal blocking standalone event loop. `Application::poll(timeout)` pumps the same PROGRAM world for every attached top-level window: negative finite timeout waits indefinitely, zero is non-blocking, and positive finite timeout is bounded. NaN/Inf and native pump failures transition the Application to a terminal error state. Normal requested/policy quit remains distinguishable from error through `last_error()`.

Default `QuitPolicy::OnLastWindowClosed` requests quit when the final valid registered window actually unregisters. `QuitPolicy::ExplicitOnly` keeps a zero-window Application runnable until `request_quit()` or error. `request_quit()` is idempotent and stops the loop after the current callback unwinds; it does not destroy live windows.

The old `StandaloneWindow(UI&, ...)` constructor and per-window blocking loop remain deprecated pre-v1 compatibility only until T069. They retain their independent-world behavior and never acquire a hidden shared Application singleton.

Embedded views remain a separate host-owned integration path and use:

```cpp
puglNewWorld(PUGL_MODULE, 0);
```

`EmbeddedView::poll()` is always non-blocking and an embedded view never registers with or borrows the standalone Application PROGRAM world.

'''
          text, count = re.subn(
              r'### 5\.2 Pugl world modes\n.*?(?=### 5\.3 No unnecessary platform abstraction layer)',
              replacement,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected one DESIGN 5.2 section, replaced {count}')
          design.write_text(text)
          PY

          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git diff --check
          grep -n 'Pugl world modes and standalone ownership' DESIGN.md
          grep -n 'commit:     195f79b22644010c81a5e0c3231c591856787ec6' DESIGN.md

          git reset --soft origin/main
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'T060: add explicit Application multi-window ownership'
          git push --force-with-lease origin HEAD:"$branch"
