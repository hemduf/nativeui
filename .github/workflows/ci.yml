name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
          - name: Linux X11
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libgl1-mesa-dev libfontconfig1-dev

      - name: Configure Unix
        if: runner.os != 'Windows'
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DNATIVEUI_BUILD_PLATFORM=ON
          -DNATIVEUI_BUILD_EXAMPLES=ON
          -DNATIVEUI_BUILD_TESTS=ON
          -DNATIVEUI_SKIA_WINDOWS_CRT=MD

      # skia-builder's Windows archive is built with the MSVC ABI. Do not use
      # Ninja from Git Bash here: on hosted runners that can select MinGW and
      # cannot link the supplied Skia.lib. The native default Visual Studio
      # generator discovers the installed MSVC toolchain without relying on
      # shell PATH ordering.
      - name: Configure Windows MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DNATIVEUI_BUILD_PLATFORM=ON
          -DNATIVEUI_BUILD_EXAMPLES=ON
          -DNATIVEUI_BUILD_TESTS=ON
          -DNATIVEUI_SKIA_WINDOWS_CRT=MD

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  sanitizers:
    name: Linux ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libfontconfig1-dev

      - name: Configure
        run: >-
          cmake -S . -B build-sanitize -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DNATIVEUI_BUILD_PLATFORM=OFF
          -DNATIVEUI_BUILD_EXAMPLES=OFF
          -DNATIVEUI_BUILD_TESTS=ON
          -DNATIVEUI_ENABLE_SANITIZERS=ON
          -DNATIVEUI_SKIA_CONFIG=Release

      - name: Build
        run: cmake --build build-sanitize --parallel 2

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure
