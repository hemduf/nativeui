name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'AGENTS.md'
      - 'CODE_REVIEW.md'
      - 'CONTEXT.md'
      - 'ROADMAP.md'
      - 'VALIDATION.md'
      - 'DESIGN.md'
      - 'THIRD_PARTY.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'AGENTS.md'
      - 'CODE_REVIEW.md'
      - 'CONTEXT.md'
      - 'ROADMAP.md'
      - 'VALIDATION.md'
      - 'DESIGN.md'
      - 'THIRD_PARTY.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-source-cache
  SCCACHE_GHA_ENABLED: 'true'
  CMAKE_BUILD_PARALLEL_LEVEL: '4'
  CTEST_PARALLEL_LEVEL: '4'
  CMAKE_C_COMPILER_LAUNCHER: sccache
  CMAKE_CXX_COMPILER_LAUNCHER: sccache
  CMAKE_OBJC_COMPILER_LAUNCHER: sccache
  CMAKE_OBJCXX_COMPILER_LAUNCHER: sccache
  NATIVEUI_CTEST_EXCLUDE: '^(nativeui_t047_attach_contract_tests|nativeui_t054_application_contract_tests|nativeui_t054_argument_boundary_tests|nativeui_t054_package_source_contract_tests)$'

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15-intel
            cmake_args: -DNATIVEUI_CI_SHARE_MACOS_EXAMPLE_BRIDGE=ON
          - name: Windows
            os: windows-latest
            cmake_args: ''
          - name: Linux X11
            os: ubuntu-latest
            cmake_args: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: nativeui-cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: |
            nativeui-cpm-${{ runner.os }}-

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: CI workflow policy contract
        if: runner.os == 'Linux'
        run: python3 tests/ci_policy_contract.py

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libdbus-1-dev libx11-dev libgl1-mesa-dev libfontconfig1-dev mesa-utils xvfb xauth

      - name: Configure Unix
        if: runner.os != 'Windows'
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DNATIVEUI_BUILD_PLATFORM=ON
          -DNATIVEUI_BUILD_EXAMPLES=ON
          -DNATIVEUI_BUILD_TESTS=ON
          -DNATIVEUI_SKIA_WINDOWS_CRT=MD
          ${{ matrix.cmake_args }}

      # Ninja keeps the MSVC ABI required by the pinned Skia archive while also
      # making CMake's compiler-launcher path available to sccache.
      - name: Configure Windows MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl
          -DNATIVEUI_BUILD_PLATFORM=ON
          -DNATIVEUI_BUILD_EXAMPLES=ON
          -DNATIVEUI_BUILD_TESTS=ON
          -DNATIVEUI_SKIA_WINDOWS_CRT=MD

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Linux X11 renderer and lifecycle smoke
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: >-
          xvfb-run -a
          -s "-screen 0 1280x1024x24 +extension GLX +render -noreset"
          sh -c 'glxinfo -B && ./build/nativeui_smoke_standalone && ./build/nativeui_example_t035_combo_popup --platform-smoke && ./build/nativeui_example_t063_dialog --platform-smoke && ./build/nativeui_example_t062_tooltip --platform-smoke'

      - name: Test Linux X11
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: >-
          xvfb-run -a
          -s "-screen 0 1280x1024x24 +extension GLX +render -noreset"
          ctest --test-dir build --output-on-failure -C Release -E '${{ env.NATIVEUI_CTEST_EXCLUDE }}'

      - name: Test
        if: runner.os != 'Linux'
        run: ctest --test-dir build --output-on-failure -C Release -E '${{ env.NATIVEUI_CTEST_EXCLUDE }}'

      # T053/CODE_REVIEW.md requires proof that two final consumers configured
      # together derive different Objective-C runtime namespaces.
      - name: macOS two-consumer Objective-C runtime isolation
        if: runner.os == 'macOS'
        run: >-
          cmake
          -DSOURCE_DIR=${{ github.workspace }}
          -DOUTER_BUILD=${{ github.workspace }}/build
          -P tests/check_objc_two_consumers.cmake

      - name: macOS clipboard, lifecycle, T035 popup, T063 dialog and T062 tooltip smoke
        if: runner.os == 'macOS'
        run: |
          ./build/nativeui_smoke_standalone
          ./build/nativeui_example_t035_combo_popup --platform-smoke
          ./build/nativeui_example_t063_dialog --platform-smoke
          ./build/nativeui_example_t062_tooltip --platform-smoke

  sanitizers:
    name: Linux ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: nativeui-cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: |
            nativeui-cpm-${{ runner.os }}-

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libdbus-1-dev libfontconfig1-dev

      - name: Configure
        run: >-
          cmake -S . -B build-sanitize -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DNATIVEUI_BUILD_PLATFORM=OFF
          -DNATIVEUI_BUILD_EXAMPLES=OFF
          -DNATIVEUI_BUILD_TESTS=ON
          -DNATIVEUI_ENABLE_SANITIZERS=ON
          -DNATIVEUI_SKIA_CONFIG=Release

      - name: Build
        run: cmake --build build-sanitize --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp:print_suppressions=1
        run: ctest --test-dir build-sanitize --output-on-failure -E '${{ env.NATIVEUI_CTEST_EXCLUDE }}'
