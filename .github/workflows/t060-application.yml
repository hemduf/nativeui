name: T060 Application Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: t060-application-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-application:
    name: T060 ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15-intel
          - name: Windows
            os: windows-latest
          - name: Linux X11
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libgl1-mesa-dev libfontconfig1-dev mesa-utils xvfb

      - name: Configure Unix
        if: runner.os != 'Windows'
        run: >-
          cmake -S tests/t060 -B build-t060 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DNATIVEUI_SOURCE_DIR=${{ github.workspace }}
          -DNATIVEUI_SKIA_WINDOWS_CRT=MD

      - name: Configure Windows MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -S tests/t060 -B build-t060 -A x64
          -DNATIVEUI_SOURCE_DIR=${{ github.workspace }}
          -DNATIVEUI_SKIA_WINDOWS_CRT=MD

      - name: Build T060 contract and example
        run: cmake --build build-t060 --config Release --parallel 2

      - name: Install Windows software OpenGL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.0/mesa3d-26.2.0-release-msvc.7z'
          $expected = 'dcb2719ef346dab5b609fcb193a5f13cfc4b0502e3f4de1ad43d349477402f47'
          $archive = Join-Path $env:RUNNER_TEMP 'mesa3d-26.2.0-release-msvc.7z'
          $extract = Join-Path $env:RUNNER_TEMP 'mesa3d-26.2.0'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Mesa archive checksum mismatch: expected $expected, got $actual"
          }
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          & 'C:\Program Files\7-Zip\7z.exe' x $archive "-o$extract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7-Zip failed with exit $LASTEXITCODE" }
          $opengl = Get-ChildItem -Path $extract -Recurse -File -Filter opengl32.dll |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            Select-Object -First 1
          $gallium = Get-ChildItem -Path $extract -Recurse -File -Filter libgallium_wgl.dll |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            Select-Object -First 1
          if (-not $opengl -or -not $gallium) {
            throw 'Mesa x64 opengl32.dll/libgallium_wgl.dll were not found after extraction'
          }
          Copy-Item $opengl.FullName build-t060\Release\opengl32.dll -Force
          Copy-Item $gallium.FullName build-t060\Release\libgallium_wgl.dll -Force

      - name: Test Linux X11
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: >-
          xvfb-run -a
          -s "-screen 0 1280x1024x24 +extension GLX +render -noreset"
          sh -c 'glxinfo -B && ctest --test-dir build-t060 --output-on-failure -C Release'

      - name: Test Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:GALLIUM_DRIVER = 'llvmpipe'
          ctest --test-dir build-t060 --output-on-failure -C Release

      - name: Test macOS
        if: runner.os == 'macOS'
        run: ctest --test-dir build-t060 --output-on-failure -C Release

  linux-sanitizers:
    name: T060 Linux ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libgl1-mesa-dev libfontconfig1-dev mesa-utils xvfb

      - name: Configure sanitized T060 contract
        run: >-
          cmake -S tests/t060 -B build-t060-sanitize -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DNATIVEUI_SOURCE_DIR=${{ github.workspace }}
          -DNATIVEUI_ENABLE_SANITIZERS=ON
          -DNATIVEUI_SKIA_CONFIG=Release

      - name: Build sanitized T060 contract
        run: cmake --build build-t060-sanitize --parallel 2

      - name: Test sanitized T060 contract
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp:print_suppressions=1
        run: >-
          xvfb-run -a
          -s "-screen 0 1280x1024x24 +extension GLX +render -noreset"
          ctest --test-dir build-t060-sanitize --output-on-failure

  finalize-t060:
    name: Finalize T060 durable design and sanitize history
    if: ${{ success() && github.event_name == 'pull_request' && github.event.pull_request.number == 118 && github.actor != 'github-actions[bot]' }}
    needs: [native-application, linux-sanitizers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/t060-application-multi-window
          fetch-depth: 0

      - name: Produce clean bot-authored T060 candidate
        shell: bash
        run: |
          set -euo pipefail
          branch='feature/t060-application-multi-window'
          expected_main='ce86c86e663ad5f8464224874039312143146300'
          expected_pugl='195f79b22644010c81a5e0c3231c591856787ec6'

          git fetch origin main "$branch"
          test "$(git rev-parse origin/main)" = "$expected_main" || {
            echo 'main advanced; refusing unsafe finalization' >&2
            exit 1
          }
          test "$(git rev-parse origin/$branch)" = '${{ github.event.pull_request.head.sha }}' || {
            echo 'branch advanced; refusing stale finalization' >&2
            exit 1
          }
          grep -q "$expected_pugl" cmake/Dependencies.cmake || {
            echo 'reviewed Pugl pin is not present on the T060 branch' >&2
            exit 1
          }
          git reset --hard "origin/$branch"

          python3 - <<'PY'
          from pathlib import Path
          import re

          old_pin = 'd12d63815b8cfe3f36293d3791a418e8f558ff1b'
          new_pin = '195f79b22644010c81a5e0c3231c591856787ec6'

          design = Path('DESIGN.md')
          text = design.read_text()
          text = text.replace('**Updated:** September 7, 2026', '**Updated:** September 9, 2026', 1)
          text = text.replace(old_pin, new_pin)

          old_snapshot = ('- `StandaloneWindow` and `EmbeddedView` Pugl/OpenGL integration;\n'
                          '- clipboard bridging and platform smoke-test infrastructure;\n'
                          '- dedicated feature examples with `--self-test` coverage.\n\n'
                          'SVG/icon resources are being implemented separately in T023/PR #60 and are not part of the merged baseline described above until that PR lands.\n\n'
                          'A known macOS defect remains open in issue #64: multiple simultaneous `StandaloneWindow` instances currently expose a Pugl `PUGL_PROGRAM` application-world lifecycle problem. Multiple independent `EmbeddedView` instances are a separate path and are currently validated successfully.\n')
          new_snapshot = ('- explicit `Application` ownership for one standalone `PUGL_PROGRAM` world with multiple top-level `StandaloneWindow` views;\n'
                          '- independent `EmbeddedView` Pugl/OpenGL integration using `PUGL_MODULE`;\n'
                          '- clipboard bridging and platform smoke-test infrastructure;\n'
                          '- dedicated feature examples with `--self-test` coverage.\n\n'
                          'Standalone multi-window ownership follows #64 Decision B: one explicit `Application` owns the PROGRAM world/event pump and outlives every attached standalone window. Per-window retained UI, focus, capture, text and rendering state remains isolated. The legacy independent-world `StandaloneWindow(UI&, ...)` constructor is pre-v1 compatibility only and is scheduled for removal by T069; it is not a second supported multi-window model.\n')
          if old_snapshot in text:
              text = text.replace(old_snapshot, new_snapshot, 1)
          elif 'A known macOS defect remains open in issue #64' in text:
              raise SystemExit('unexpected DESIGN current-snapshot shape')

          replacement = '''### 5.2 Pugl world modes and standalone ownership

Standalone applications use one explicit application owner:

```cpp
ui::Application app;
ui::StandaloneWindow main{app, main_ui, {.title = "Main"}};
ui::StandaloneWindow settings{app, settings_ui, {.title = "Settings"}};
return app.run();
```

`Application` owns exactly one:

```cpp
puglNewWorld(PUGL_PROGRAM, 0);
```

Every v1 top-level `StandaloneWindow(Application&, ...)` borrows that world and owns only its own native view/render/UI/focus/capture/text state. `Application` is non-copyable/non-movable and must outlive all registered windows. Registration is Application-local and lifetime-safe; NativeUI has no mutable process-global, singleton or `thread_local` current Application/window registry.

`Application::run()` is the normal blocking standalone event loop. `Application::poll(timeout)` pumps the same PROGRAM world for every attached top-level window: negative finite timeout waits indefinitely, zero is non-blocking, and positive finite timeout is bounded. NaN/Inf and native pump failures transition the Application to a terminal error state. Normal requested/policy quit remains distinguishable from error through `last_error()`.

Default `QuitPolicy::OnLastWindowClosed` requests quit when the final valid registered window actually unregisters. `QuitPolicy::ExplicitOnly` keeps a zero-window Application runnable until `request_quit()` or error. `request_quit()` is idempotent and stops the loop after the current callback unwinds; it does not destroy live windows.

The old `StandaloneWindow(UI&, ...)` constructor and per-window blocking loop remain deprecated pre-v1 compatibility only until T069. They retain their independent-world behavior and never acquire a hidden shared Application singleton.

Embedded views remain a separate host-owned integration path and use:

```cpp
puglNewWorld(PUGL_MODULE, 0);
```

`EmbeddedView::poll()` is always non-blocking and an embedded view never registers with or borrows the standalone Application PROGRAM world.

'''
          text, count = re.subn(
              r'### 5\.2 Pugl world modes\n.*?(?=### 5\.3 No unnecessary platform abstraction layer)',
              replacement,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected one DESIGN 5.2 section, replaced {count}')
          design.write_text(text)

          workflow = Path('.github/workflows/t060-application.yml')
          text = workflow.read_text()
          text = text.replace('permissions:\n  contents: write', 'permissions:\n  contents: read', 1)
          marker = '\n  finalize-t060:\n'
          if marker not in text:
              raise SystemExit('expected temporary finalizer not found')
          workflow.write_text(text.split(marker, 1)[0].rstrip() + '\n')
          PY

          git diff --check
          grep -n 'Pugl world modes and standalone ownership' DESIGN.md
          grep -n 'commit:     195f79b22644010c81a5e0c3231c591856787ec6' DESIGN.md

          git reset --soft origin/main
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'T060: add explicit Application multi-window ownership'
          git push --force-with-lease origin HEAD:"$branch"
