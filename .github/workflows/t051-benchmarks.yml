name: T051 Release Benchmarks

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/t051/**'
      - 'tests/t051_benchmarks.cpp'
      - 'tests/t051_workload_contract_tests.cpp'
      - 'tests/benchmarks/**'
      - '.github/workflows/t051-benchmarks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t051-benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-benchmarks:
    name: Release benchmark suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libfontconfig1-dev

      - name: Configure benchmark project
        run: >-
          cmake -S tests/t051 -B build-t051 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DNATIVEUI_SOURCE_DIR=${{ github.workspace }}
          -DNATIVEUI_BENCHMARK_COMMIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build benchmark suite
        run: cmake --build build-t051 --parallel 2

      - name: Workload and allocation contract tests
        run: ctest --test-dir build-t051 --output-on-failure

      - name: Harness self-test
        run: ./build-t051/nativeui_benchmarks --self-test

      - name: Run full fixed protocol A
        run: ./build-t051/nativeui_benchmarks --json t051-results-a.json

      - name: Run full fixed protocol B on same runner
        run: ./build-t051/nativeui_benchmarks --json t051-results-b.json

      - name: Validate repeated-run metadata and report deltas
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          first = json.loads(Path('t051-results-a.json').read_text())['results']
          second = json.loads(Path('t051-results-b.json').read_text())['results']
          if len(first) != len(second):
              raise SystemExit('T051 repeated-run result count mismatch')

          compatible = (
              'schema_version', 'workload_version', 'benchmark_name', 'os',
              'architecture', 'compiler_id', 'compiler_major', 'build_type',
              'operations_per_sample'
          )
          for a, b in zip(first, second):
              for field in compatible:
                  if a[field] != b[field]:
                      raise SystemExit(
                          f'T051 repeated-run metadata mismatch for {a["benchmark_name"]}: {field}')
              if a['benchmark_name'] == 'idle_invalidation':
                  if a['allocations_per_op'] != 0 or b['allocations_per_op'] != 0:
                      raise SystemExit('T051 idle repeated run unexpectedly allocated')
                  print('idle_invalidation: hard gate stable at zero')
                  continue
              median_delta = ((b['median_ns_per_op'] / a['median_ns_per_op']) - 1.0) * 100.0
              p95_delta = ((b['p95_ns_per_op'] / a['p95_ns_per_op']) - 1.0) * 100.0
              print(
                  f'{a["benchmark_name"]}: median {median_delta:+.2f}% '
                  f'p95 {p95_delta:+.2f}% allocations '
                  f'{a["allocations_per_op"]}->{b["allocations_per_op"]} '
                  f'bytes {a["bytes_allocated_per_op"]}->{b["bytes_allocated_per_op"]}')
          PY

      - name: Validate selected filter
        run: ./build-t051/nativeui_benchmarks --filter text_edit --json t051-text-results.json

      - uses: actions/upload-artifact@v4
        with:
          name: t051-release-results
          path: |
            t051-results-a.json
            t051-results-b.json
            t051-text-results.json
          if-no-files-found: error
