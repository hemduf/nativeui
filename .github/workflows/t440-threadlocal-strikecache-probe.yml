name: T440 experimental thread-local strike cache

# Temporary research-only workflow for hemduf/nativeui#440.
#
# It is intentionally not part of the normal PR/CI surface:
#   - it only exists on the research branch issue/440-skia-threadlocal-strikecache;
#   - its jobs run only when the pushed commit message contains [t440-run]
#     (workflow_dispatch also works once the file exists on the default branch).
# It must be removed, or explicitly justified, before the research PR is merged.
#
# The consumed Skia variant is an experimental prerelease published by
# hemduf/skia-builder (tag experiment/tls-strikecache-m153) built at the same
# chrome/m153 milestone with skia_enable_threadlocal_strikecache = true. It is
# never a NativeUI production dependency pin.

on:
  push:
    branches:
      - issue/440-skia-threadlocal-strikecache
  workflow_dispatch:

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  EXPERIMENT_TAG: experiment/tls-strikecache-m153

jobs:
  measure:
    name: measure ${{ matrix.name }}
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[t440-run]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            asset: skia-build-mac-universal-gpu-release.zip
            pinned_sha: bbf23943d044a70b07bab3f935dc8bf725fac8f77593f2bd3f9c77cdb16bb640
            probe_a: ./build-a/nativeui_t440_strikecache_probe
            probe_b: ./build-b/nativeui_t440_strikecache_probe
          - name: linux-x64
            os: ubuntu-24.04
            asset: skia-build-linux-x64-gpu-release.zip
            pinned_sha: 8da94ec6532d2586fdd719859b8437da20b1b5fad30951703dd19fa4a679eca9
            probe_a: ./build-a/nativeui_t440_strikecache_probe
            probe_b: ./build-b/nativeui_t440_strikecache_probe
          - name: windows-x64-md
            os: windows-2022
            asset: skia-build-win-x64-gpu-md-release.zip
            pinned_sha: 3e19bd7fb8fc81f8ac554c8a4add24ac21815d618227184d5c69aea885a20ce7
            probe_a: ./build-a/nativeui_t440_strikecache_probe.exe
            probe_b: ./build-b/nativeui_t440_strikecache_probe.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build prerequisites
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y ninja-build pkg-config libfontconfig1-dev
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew list ninja >/dev/null 2>&1 || brew install ninja
          elif [ "$RUNNER_OS" = "Windows" ]; then
            choco install ninja --no-progress --yes
            echo "C:/ProgramData/chocolatey/bin" >> "$GITHUB_PATH"
          fi

      - name: Download variant B (compiled with thread-local strike cache)
        shell: bash
        run: |
          curl -fsSL -o variant-b.zip \
            "https://github.com/hemduf/skia-builder/releases/download/${EXPERIMENT_TAG}/${{ matrix.asset }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -m zipfile -e variant-b.zip .
          else
            unzip -q variant-b.zip
          fi
          mkdir -p variant-b
          if [ -d build ]; then mv build variant-b/build; fi

      - name: Record variant B archive SHA256
        id: b_sha
        shell: bash
        run: |
          SHA=$(python3 -c "import hashlib,sys;print(hashlib.sha256(open('variant-b.zip','rb').read()).hexdigest())")
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "Variant B archive SHA256: $SHA"

      - name: Configure and build variant B (compiled ON)
        shell: bash
        run: |
          cmake -S tests/t051 -B build-b -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DNATIVEUI_SOURCE_DIR="$PWD" \
            -DNATIVEUI_BENCHMARK_COMMIT_SHA="$(git rev-parse HEAD)" \
            -DNATIVEUI_SKIA_ROOT="$PWD/variant-b"
          cmake --build build-b

      - name: Configure and build variant A (pinned OFF)
        shell: bash
        run: |
          cmake -S tests/t051 -B build-a -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DNATIVEUI_SOURCE_DIR="$PWD" \
            -DNATIVEUI_BENCHMARK_COMMIT_SHA="$(git rev-parse HEAD)"
          cmake --build build-a

      - name: Variant A/B self-tests
        shell: bash
        run: |
          "${{ matrix.probe_a }}" --self-test
          "${{ matrix.probe_b }}" --self-test

      - name: Measured runs A1 B1 A2 B2 (frozen 5+30 protocol)
        shell: bash
        run: |
          "${{ matrix.probe_a }}" --variant A --threads 1,2,4,8 \
            --skia-archive-sha256 "${{ matrix.pinned_sha }}" --json t440-A1.json
          "${{ matrix.probe_b }}" --variant B --threads 1,2,4,8 \
            --skia-archive-sha256 "${{ steps.b_sha.outputs.sha256 }}" --json t440-B1.json
          "${{ matrix.probe_a }}" --variant A --threads 1,2,4,8 \
            --skia-archive-sha256 "${{ matrix.pinned_sha }}" --json t440-A2.json
          "${{ matrix.probe_b }}" --variant B --threads 1,2,4,8 \
            --skia-archive-sha256 "${{ steps.b_sha.outputs.sha256 }}" --json t440-B2.json

      - name: Upload measurement evidence
        uses: actions/upload-artifact@v4
        with:
          name: t440-measure-${{ matrix.name }}
          path: t440-*.json
          if-no-files-found: error

  sanitize:
    name: sanitize linux-x64
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[t440-run]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libfontconfig1-dev

      - name: Download variant B (compiled with thread-local strike cache)
        shell: bash
        run: |
          curl -fsSL -o variant-b.zip \
            "https://github.com/hemduf/skia-builder/releases/download/${EXPERIMENT_TAG}/skia-build-linux-x64-gpu-release.zip"
          unzip -q variant-b.zip
          mkdir -p variant-b
          if [ -d build ]; then mv build variant-b/build; fi

      - name: Configure sanitizer build (variant B)
        shell: bash
        run: |
          cmake -S tests/t051 -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DNATIVEUI_SOURCE_DIR="$PWD" \
            -DNATIVEUI_BENCHMARK_COMMIT_SHA="$(git rev-parse HEAD)" \
            -DNATIVEUI_SKIA_ROOT="$PWD/variant-b" \
            -DNATIVEUI_ENABLE_SANITIZERS=ON
          cmake --build build-asan

      - name: ASan/UBSan self-test and lifecycle
        shell: bash
        run: |
          ./build-asan/nativeui_t440_strikecache_probe --self-test
          ./build-asan/nativeui_t440_strikecache_probe --variant B --threads 1,2 --json t440-asan.json

      - name: LSan observation (thread-exit retention is expected and recorded)
        continue-on-error: true
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=0
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp:print_suppressions=1
        shell: bash
        run: |
          ./build-asan/nativeui_t440_strikecache_probe --variant B --threads 1,2 \
            --json t440-lsan.json 2>&1 | tee t440-lsan.txt

      - name: Upload sanitizer evidence
        uses: actions/upload-artifact@v4
        with:
          name: t440-sanitize
          path: |
            t440-asan.json
            t440-lsan.json
            t440-lsan.txt
          if-no-files-found: warn
