name: Temporary Windows EditSession Diagnostic

on:
  push:
    branches:
      - feature/render-resource-cache-impl

permissions:
  contents: read

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-source-cache
  CMAKE_BUILD_PARALLEL_LEVEL: '2'

jobs:
  edit-session:
    name: Windows EditSession
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: nativeui-cpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: nativeui-cpm-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build-edit -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_CXX_FLAGS=/Zi
          -DNATIVEUI_BUILD_PLATFORM=OFF
          -DNATIVEUI_BUILD_TESTS=ON
          -DNATIVEUI_BUILD_EXAMPLES=OFF
          -DNATIVEUI_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-edit --target nativeui_edit_session_tests
      - name: Test
        shell: pwsh
        run: |
          & .\build-edit\nativeui_edit_session_tests.exe
          $code = $LASTEXITCODE
          Write-Host "direct-exit-code=$code"
          if ($code -ne 0) { exit $code }
