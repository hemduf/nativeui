name: T067 Virtual List Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'include/nativeui/virtual_list.hpp'
      - 'include/nativeui/detail/virtual_list_*'
      - 'include/nativeui/semantics.hpp'
      - 'tests/t067/**'
      - 'tests/t067_retained/**'
      - 'tests/t067_*'
      - 'examples/features/t067_*'
      - '.github/workflows/t067-virtual-list.yml'
  push:
    branches: [main]
    paths:
      - 'include/nativeui/virtual_list.hpp'
      - 'include/nativeui/detail/virtual_list_*'
      - 'include/nativeui/semantics.hpp'
      - 'tests/t067/**'
      - 'tests/t067_retained/**'
      - 'tests/t067_*'
      - 'examples/features/t067_*'
      - '.github/workflows/t067-virtual-list.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  root-integration-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify root integration contract
        run: cmake -DSOURCE_DIR="$GITHUB_WORKSPACE" -P tests/t067_root_integration_contract.cmake

  virtual-list-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated virtual-list contract
        run: cmake -S tests/t067 -B build-t067 -DCMAKE_BUILD_TYPE=Release
      - name: Build isolated virtual-list contract
        run: cmake --build build-t067 --config Release --parallel
      - name: Run isolated virtual-list contract
        run: ctest --test-dir build-t067 -C Release --output-on-failure

  retained-runtime-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install retained-runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev
      - name: Configure retained-runtime contract
        run: cmake -S tests/t067_retained -B build-t067-retained -DCMAKE_BUILD_TYPE=Release
      - name: Build retained-runtime contract
        run: cmake --build build-t067-retained --parallel
      - name: Run retained-runtime contract
        run: ctest --test-dir build-t067-retained --output-on-failure

  example-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install example dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libdbus-1-dev libx11-dev libgl1-mesa-dev libfontconfig1-dev
      - name: Configure T067 example
        run: >-
          cmake -S . -B build-t067-example -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DNATIVEUI_BUILD_PLATFORM=ON
          -DNATIVEUI_BUILD_EXAMPLES=ON
          -DNATIVEUI_BUILD_TESTS=OFF
      - name: Build T067 example
        run: cmake --build build-t067-example --target nativeui_example_t067_virtual_list --parallel 2
      - name: Run T067 example self-test
        run: ./build-t067-example/nativeui_example_t067_virtual_list --self-test
