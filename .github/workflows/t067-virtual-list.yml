name: T067 Virtual List Contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  virtual-list-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated virtual-list contract
        run: cmake -S tests/t067 -B build-t067 -DCMAKE_BUILD_TYPE=Release
      - name: Build isolated virtual-list contract
        run: cmake --build build-t067 --config Release --parallel
      - name: Run isolated virtual-list contract
        run: ctest --test-dir build-t067 -C Release --output-on-failure
