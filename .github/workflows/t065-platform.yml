name: T065 Platform Dispatcher

on:
  pull_request:
    branches: [main]
    paths:
      - 'include/nativeui/dispatcher.hpp'
      - 'include/nativeui/window.hpp'
      - 'include/nativeui/detail/dispatcher_owner.hpp'
      - 'src/dispatcher.cpp'
      - 'src/pugl_skia.cpp'
      - 'src/detail/pugl_skia_*.inc'
      - 'tests/t065_platform/**'
      - 'tests/t065_platform_tests.cpp'
      - 'examples/features/t065_ui_dispatcher.cpp'
      - '.github/workflows/t065-platform.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t065-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-platform:
    name: T065 ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15-intel
          - name: Windows
            os: windows-latest
          - name: Linux X11
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libgl1-mesa-dev libfontconfig1-dev mesa-utils xvfb

      - name: Configure Unix
        if: runner.os != 'Windows'
        run: >-
          cmake -S tests/t065_platform -B build-t065-platform -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DNATIVEUI_SOURCE_DIR=${{ github.workspace }}
          -DNATIVEUI_SKIA_WINDOWS_CRT=MD

      - name: Configure Windows MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -S tests/t065_platform -B build-t065-platform -A x64
          -DNATIVEUI_SOURCE_DIR=${{ github.workspace }}
          -DNATIVEUI_SKIA_WINDOWS_CRT=MD

      - name: Build
        run: cmake --build build-t065-platform --config Release --parallel 2

      - name: Install Windows software OpenGL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.0/mesa3d-26.2.0-release-msvc.7z'
          $expected = 'dcb2719ef346dab5b609fcb193a5f13cfc4b0502e3f4de1ad43d349477402f47'
          $archive = Join-Path $env:RUNNER_TEMP 'mesa3d.7z'
          $extract = Join-Path $env:RUNNER_TEMP 'mesa3d'
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Mesa archive checksum mismatch'
          }
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          & 'C:\Program Files\7-Zip\7z.exe' x $archive "-o$extract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7-Zip failed with exit $LASTEXITCODE" }
          $opengl = Get-ChildItem -Path $extract -Recurse -File -Filter opengl32.dll | Where-Object { $_.FullName -match '[\\/]x64[\\/]' } | Select-Object -First 1
          $gallium = Get-ChildItem -Path $extract -Recurse -File -Filter libgallium_wgl.dll | Where-Object { $_.FullName -match '[\\/]x64[\\/]' } | Select-Object -First 1
          if (-not $opengl -or -not $gallium) { throw 'Mesa x64 DLLs not found' }
          Copy-Item $opengl.FullName build-t065-platform\Release\opengl32.dll -Force
          Copy-Item $gallium.FullName build-t065-platform\Release\libgallium_wgl.dll -Force

      - name: Test Linux X11
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: >-
          xvfb-run -a
          -s "-screen 0 1280x1024x24 +extension GLX +render -noreset"
          sh -c 'glxinfo -B && ctest --test-dir build-t065-platform --output-on-failure -C Release'

      - name: Test Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:GALLIUM_DRIVER = 'llvmpipe'
          ctest --test-dir build-t065-platform --output-on-failure -C Release

      - name: Test macOS
        if: runner.os == 'macOS'
        run: ctest --test-dir build-t065-platform --output-on-failure -C Release

  linux-sanitizers:
    name: T065 Linux ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libgl1-mesa-dev libfontconfig1-dev mesa-utils xvfb
      - name: Configure
        run: >-
          cmake -S tests/t065_platform -B build-t065-platform-sanitize -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DNATIVEUI_SOURCE_DIR=${{ github.workspace }}
          -DNATIVEUI_ENABLE_SANITIZERS=ON
          -DNATIVEUI_SKIA_CONFIG=Release
      - name: Build
        run: cmake --build build-t065-platform-sanitize --parallel 2
      - name: Test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp:print_suppressions=1
        run: >-
          xvfb-run -a
          -s "-screen 0 1280x1024x24 +extension GLX +render -noreset"
          ctest --test-dir build-t065-platform-sanitize --output-on-failure
