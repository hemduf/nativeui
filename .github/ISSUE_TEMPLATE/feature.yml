name: Feature
description: NativeUI feature work item
title: "[Txxx] "
labels: [enhancement]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] Behavior implemented
        - [ ] Unit/integration tests added
        - [ ] Dedicated executable example added/updated
        - [ ] Example `--self-test` passes
        - [ ] macOS / Windows / Linux CI green
        - [ ] Mandatory final review completed against `CODE_REVIEW.md`
        - [ ] Instance isolation and mutable globals/statics reviewed
        - [ ] Threading/real-time and lifetime/reentrancy reviewed
        - [ ] Objective-C runtime names/prefixing reviewed when `.m`/`.mm` or ObjC runtime code is touched
        - [ ] All blocking code-review findings corrected before merge/Done
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
  - type: textarea
    id: review_record
    attributes:
      label: Mandatory code review record
      description: Complete before merge/Done. Follow CODE_REVIEW.md and record applicable findings/corrections.
      value: |
        - CODE_REVIEW.md: pending
        - Instance isolation: pending
        - Globals/statics: pending
        - Threading/RT: pending
        - Lifetime/reentrancy: pending
        - Objective-C runtime: pending / not applicable
        - Platform integration: pending
        - Tests: pending
        - Remaining blocking findings: pending
